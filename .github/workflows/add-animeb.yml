          old2="      langOn(config, 'ka') && tmdb ? (type === 'series' ? gemEpisode(tmdb, season, episode) : gemMovie(tmdb)) : Promise.resolve([]),"
          new2=old2+"\n      langOn(config, 'ka') && name ? animebResolve(name, year, type, season, episode) : Promise.resolve([]),"
          if old2 not in s: raise SystemExit('KA resolver marker not found')
          s=s.replace(old2,new2,1)
          old3="        ...gemToStremio(ka),     // 🇬🇪 Georgian (ge.movie)"
          new3=old3+"\n        ...animeb,                // 🇬🇪 Georgian (AnimeB)"
