          if marker not in s:
              raise SystemExit('stream handler marker not found')
          code=r'''// ─────────────────────────────────────────
//  ANIMEB — Georgian-dubbed anime
//  AnimeB pages expose the episode player URLs in their server-rendered
//  playlist configuration. We resolve the requested anime page, extract the
//  matching episode from every configured player, and expose those player URLs
//  as Stremio externalUrl streams. This is intentionally an externalUrl rather
//  than a fake direct-media URL: AnimeB currently points episodes at iframe
//  players such as Filemoon, Sibnet, and CSST, not raw media files.
// ─────────────────────────────────────────
const ANIMEB_SITE = 'https://animeb.ge';
const _animebCache = new Map();
const ANIMEB_CACHE_TTL = 5 * 60 * 1000;

function animebText(s) {
  return String(s || '')
    .replace(/<[^>]+>/g, ' ')
    .replace(/&amp;/g, '&').replace(/&quot;/g, '"').replace(/&#39;|&apos;/g, "'")
    .replace(/&nbsp;/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

function animebNorm(s) {
  return animebText(s).toLowerCase()
    .normalize('NFKD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9\u10a0-\u10ff]+/g, ' ')
    .trim();
}

async function animebHtml(url) {
  const r = await fetch(url, {
    headers: { 'User-Agent': UA, Accept: 'text/html,application/xhtml+xml', Referer: ANIMEB_SITE + '/' },
    timeout: 10000,
    redirect: 'follow'
  });
  if (!r.ok) throw new Error(`AnimeB HTTP ${r.status}`);
  return r.text();
}

function animebCandidates(html, query) {
  const out = [];
  const seen = new Set();
  const q = animebNorm(query);
  const qTokens = q.split(' ').filter(x => x.length >= 2);
  const re = /href=["'](\/anime\/[^"'#?]+\.html)["'][^>]*>([\s\S]*?)<\/a>/gi;
  let m;
  while ((m = re.exec(html))) {
    const href = m[1];
    if (seen.has(href)) continue;
    seen.add(href);
    const title = animebText(m[2]);
    if (!title) continue;
    const n = animebNorm(title + ' ' + href);
    let score = 0;
    if (n.includes(q)) score += 100;
    for (const t of qTokens) if (n.includes(t)) score += 8;
    if (/animeb\.ge\/anime\//.test(href)) score += 2;
    out.push({ href: new URL(href, ANIMEB_SITE).toString(), title, score });
  }
  return out.sort((a, b) => b.score - a.score).slice(0, 12);
}

function animebEpisodeUrls(html, episode) {
  const wanted = Number(episode) || 1;
  const found = new Map();
  const re = /["']title["']\s*:\s*["']სერია\s*(\d+)["'][^}]*["']url["']\s*:\s*["']([^"']+)["']/gi;
  let m;
  while ((m = re.exec(html))) {
    if (Number(m[1]) !== wanted) continue;
    const u = m[2];
    if (/^https?:\/\//i.test(u)) found.set(u, true);
  }
  return [...found.keys()];
}

async function animebResolve(name, year, type, season, episode) {
  if (!name || type !== 'series') return [];
  const ck = `${animebNorm(name)}|${year || ''}|${season || 1}|${episode || 1}`;
  const hit = _animebCache.get(ck);
  if (hit && Date.now() - hit.at < ANIMEB_CACHE_TTL) return hit.value;
  try {
    const searchUrls = [
      `${ANIMEB_SITE}/index.php?do=search&subaction=search&story=${encodeURIComponent(name)}`,
      `${ANIMEB_SITE}/?do=search&subaction=search&story=${encodeURIComponent(name)}`
    ];
    const candidates = [];
    const seen = new Set();
    for (const u of searchUrls) {
      try {
        const h = await animebHtml(u);
        for (const c of animebCandidates(h, name)) {
          if (!seen.has(c.href)) { seen.add(c.href); candidates.push(c); }
        }
      } catch {}
      if (candidates.length) break;
    }
    candidates.sort((a, b) => b.score - a.score);
    const qn = animebNorm(name);
    const results = [];
    for (const c of candidates.slice(0, 6)) {
      let h;
      try { h = await animebHtml(c.href); } catch { continue; }
      const titleMatch = animebNorm(h).includes(qn) || animebNorm(c.title).includes(qn);
      const yearMatch = !year || h.includes(`წელი ${year}`) || h.includes(`>${year}<`);
      const urls = animebEpisodeUrls(h, episode);
      if (!urls.length) continue;
      if (titleMatch) {
        for (const u of urls.slice(0, 4)) results.push({ url: u, title: c.title });
        if (yearMatch) break;
      }
    }
    const value = results.map((r, i) => ({
      url: r.url,
      name: `AnimeB • ქართული • Player ${i + 1}`,
      description: `AnimeB Georgian dub • Episode ${episode}`,
      behaviorHints: { notWebReady: true, bingeGroup: 'animeb-ka' },
      externalUrl: r.url
    }));
    _animebCache.set(ck, { at: Date.now(), value });
    return value;
  } catch (e) {
    console.warn('AnimeB resolve failed:', e.message);
    _animebCache.set(ck, { at: Date.now(), value: [] });
    return [];
  }
}

'''
