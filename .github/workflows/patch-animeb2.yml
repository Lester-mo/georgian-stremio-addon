name: patch-animeb2
on: push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply AnimeB patch
        run: |
          set -euo pipefail
          PAYLOAD='' 
          echo "$PAYLOAD" | base64 -d > /tmp/add_animeb.py
          python3 /tmp/add_animeb.py
          node --check index.js
          git diff --check
          git add index.js
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Add AnimeB Georgian anime source'
          git push
      - name: Cleanup temporary workflows
        run: |
          set +e
          rm -f .github/workflows/patch-animeb2.yml .github/workflows/probe-animeb.yml
          git add -A .github/workflows
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Remove temporary AnimeB workflows'
          git push
