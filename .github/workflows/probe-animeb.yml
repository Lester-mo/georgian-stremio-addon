name: probe-animeb
on:
  push:
    paths:
      - '.github/workflows/probe-animeb.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe AnimeB player page and addon structure
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --retry 2 -A 'Mozilla/5.0' 'https://animeb.ge/anime/334-gurren-lagann.html' -o /tmp/animeb.html
          echo '--- AnimeB player playlist lines ---'
          grep -Ein 'playlist:|sourceType:|video\.sibnet|filemoon|csst\.online|m3u8|mp4' /tmp/animeb.html | head -n 250 || true
          echo '--- index.js relevant structure ---'
          curl -L --retry 2 -A 'Mozilla/5.0' 'https://raw.githubusercontent.com/Lester-mo/georgian-stremio-addon/main/index.js' -o /tmp/index.js
          grep -nE 'function .*ToStremio|function .*Resolve|ANILIBERTY|streamHandler|defineStreamHandler|\.stream\(|Promise\.all|config\.ka|args\.config' /tmp/index.js | head -n 250 || true
          echo '--- functions near stream handler ---'
          grep -nE 'builder\.defineStreamHandler|defineStreamHandler' /tmp/index.js | while IFS=: read -r n _; do start=$((n-30)); end=$((n+100)); sed -n "${start},${end}p" /tmp/index.js; done
