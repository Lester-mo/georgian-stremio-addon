# Render Blueprint — auto-configures the free web service when you connect this repo.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: georgian-stredio-addon
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    # The addon answers /manifest.json with 200 once it's up.
    healthCheckPath: /manifest.json
    autoDeploy: true
    envVars:
      # The in-addon stream proxy derives its public URL from the request Host on
      # Render automatically, so PUBLIC_URL is OPTIONAL. If streams ever come back
      # as raw CDN links, set PUBLIC_URL to your full https://<name>.onrender.com URL.
      - key: PUBLIC_URL
        sync: false
      # Cloudflare Worker that relays the non-IP-locked sources (ge.movie, UAFlix)
      # so their video bytes use Cloudflare's unmetered bandwidth instead of
      # Render's quota. HDRezka stays on the origin (it's IP-locked to this server).
      - key: WORKER_PROXY
        value: https://stredio-stream.shonomusicofficial.workers.dev
